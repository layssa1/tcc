<!-- Global Toast Notifications -->
<div class="toast-container" *ngIf="dataService.toasts().length > 0">
  <div
    *ngFor="let toast of dataService.toasts()"
    class="toast-item"
    [ngClass]="'toast-item--' + toast.tipo"
    (click)="dataService.removeToast(toast.id)"
  >
    <span class="toast-icon">
      <ng-container *ngIf="toast.tipo === 'success'">✓</ng-container>
      <ng-container *ngIf="toast.tipo === 'error'">✕</ng-container>
      <ng-container *ngIf="toast.tipo === 'info'">ℹ</ng-container>
    </span>
    <span class="toast-text">{{ toast.texto }}</span>
  </div>
</div>

<!-- Login Route (Full Screen, No App Shell) -->
<ng-container *ngIf="isLoginRoute(); else appShellTemplate">
  <router-outlet></router-outlet>
</ng-container>

<!-- Logged In App Shell -->
<ng-template #appShellTemplate>
  <div class="app-shell" [class.menu-open]="isMobileMenuOpen()">
    <!-- Mobile Backdrop -->
    <div
      class="mobile-backdrop"
      *ngIf="isMobileMenuOpen()"
      (click)="closeMobileMenu()"
    ></div>

    <!-- Sidebar Component -->
    <app-side-menu (closeMobile)="closeMobileMenu()"></app-side-menu>

    <!-- Content Area with Topbar -->
    <div class="shell-main">
      <!-- Top Navigation Bar -->
      <header class="topbar">
        <div class="topbar-left">
          <button
            type="button"
            class="mobile-toggle"
            (click)="toggleMobileMenu()"
            aria-label="Abrir menu lateral"
          >
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </button>

          <div class="institution-chip">
            <span class="institution-dot"></span>
            <strong>E.E. Monsenhor Bicudo</strong>
            <span class="institution-sep">•</span>
            <span>Semana 40</span>
          </div>
        </div>

        <div class="topbar-right">
          <div class="quick-status">
            <span class="status-indicator"></span>
            <span class="status-text">Período Letivo 2026</span>
          </div>

          <div class="user-chip">
            <div class="user-avatar">AD</div>
            <div class="user-meta">
              <strong>Administração</strong>
              <small>Gestão Escolar</small>
            </div>
            <button
              type="button"
              class="btn-logout"
              (click)="logout()"
              title="Encerrar sessão"
            >
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                <polyline points="16 17 21 12 16 7"></polyline>
                <line x1="21" y1="12" x2="9" y2="12"></line>
              </svg>
            </button>
          </div>
        </div>
      </header>

      <!-- Main Content Outlet -->
      <main class="page-container">
        <router-outlet></router-outlet>
      </main>
    </div>
  </div>
</ng-template>
