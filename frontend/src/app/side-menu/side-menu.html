<aside class="sidebar">

  <div class="logo">
    <div class="logo-icon">
      🏫
    </div>

    <div class="logo-text">
      <h2>ReservaLab</h2>
      <span>Monsenhor Bicudo</span>
    </div>
  </div>

  <!-- MENU -->
  <nav class="menu">
    <!-- DASHBOARD -->
    <a routerLink="/dashboard" routerLinkActive="ativo" [routerLinkActiveOptions]="{ exact: true }" class="menu-item">
      <span class="menu-icon">📊</span>
      <span>Dashboard</span>
    </a>

    <!-- AGENDA -->
    <a routerLink="/agenda" routerLinkActive="ativo" class="menu-item">

    <a routerLink="/nova-reserva" routerLinkActive="ativo" class="menu-item">

    <!-- PROFESSORES -->
    <a routerLink="/professores" routerLinkActive="ativo" class="menu-item">
      <span class="menu-icon">👨‍🏫</span>
      <span>Professores</span>

    <!-- ESPAÇOS -->
    <a routerLink="/espacos" routerLinkActive="ativo" class="menu-item">
      <span class="menu-icon">🏫</span>
      <span>Espaços</span>
    </a>

    <!-- EQUIPAMENTOS -->
    <a routerLink="/equipamentos" routerLinkActive="ativo" class="menu-item">
      <span class="menu-icon">💻</span>
      <span>Equipamentos</span>

  <div class="administrador">
    <div class="admin-avatar">
