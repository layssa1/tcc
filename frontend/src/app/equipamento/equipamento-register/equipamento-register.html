<div class="register-page">
  <header class="view-header">
    <div class="view-header__left">
      <span class="view-header__badge">CADASTRO DE PATRIMÔNIO</span>
      <h1 class="view-header__title">Novo Equipamento</h1>
      <p class="view-header__subtitle">
        Cadastre novos notebooks, projetores, kits de robótica e recursos audiovisuais no sistema.
      </p>
    </div>

    <div class="view-header__actions">
      <a routerLink="/equipamento" class="btn btn-secondary">
        ← Voltar ao Inventário
      </a>
    </div>
  </header>

  <div class="ui-card register-card">
    <form (ngSubmit)="salvar()">
      <div class="form-group">
        <label class="form-label" for="regEqNome">Nome / Modelo do Equipamento *</label>
        <input
          id="regEqNome"
          type="text"
          class="form-control"
          placeholder="Ex.: Projetor Epson PowerLite 3500 Lumens"
          [(ngModel)]="nome"
          name="nome"
          required
        >
      </div>

      <div class="form-row">
        <div class="form-group flex-1">
          <label class="form-label" for="regEqCat">Categoria</label>
          <select
            id="regEqCat"
            class="form-select"
            [(ngModel)]="categoria"
            name="categoria"
          >
            <option value="Áudio & Vídeo">Áudio & Vídeo</option>
            <option value="Informática">Informática</option>
            <option value="Robótica">Robótica Educacional</option>
            <option value="Áudio">Áudio & Som</option>
            <option value="Maker">Cultura Maker / 3D</option>
          </select>
        </div>

        <div class="form-group flex-1">
          <label class="form-label" for="regEqPat">Número de Patrimônio</label>
          <input
            id="regEqPat"
            type="text"
            class="form-control"
            [(ngModel)]="patrimonio"
            name="patrimonio"
          >
        </div>
      </div>

      <div class="form-row">
        <div class="form-group flex-1">
          <label class="form-label" for="regEqTot">Quantidade Total</label>
          <input
            id="regEqTot"
            type="number"
            class="form-control"
            [(ngModel)]="quantidadeTotal"
            name="quantidadeTotal"
            min="1"
            required
          >
        </div>

        <div class="form-group flex-1">
          <label class="form-label" for="regEqDisp">Quantidade Disponível</label>
          <input
            id="regEqDisp"
            type="number"
            class="form-control"
            [(ngModel)]="quantidadeDisponivel"
            name="quantidadeDisponivel"
            min="0"
            required
          >
        </div>
      </div>

      <div class="form-row">
        <div class="form-group flex-1">
          <label class="form-label" for="regEqIcon">Ícone</label>
          <select
            id="regEqIcon"
            class="form-select"
            [(ngModel)]="icone"
            name="icone"
          >
            <option value="📽️">📽️ Projetor</option>
            <option value="💻">💻 Notebook</option>
            <option value="🤖">🤖 Robótica</option>
            <option value="🔊">🔊 Som / Bluetooth</option>
            <option value="🖨️">🖨️ Impressora 3D</option>
            <option value="🎙️">🎙️ Microfone</option>
          </select>
        </div>

        <div class="form-group flex-1">
          <label class="form-label" for="regEqSt">Status</label>
          <select
            id="regEqSt"
            class="form-select"
            [(ngModel)]="status"
            name="status"
          >
            <option value="Disponível">Disponível</option>
            <option value="Em uso">Em uso regular</option>
            <option value="Em manutenção">Em manutenção</option>
          </select>
        </div>
      </div>

      <div class="ui-card-footer">
        <a routerLink="/equipamento" class="btn btn-secondary">
          Cancelar
        </a>
        <button type="submit" class="btn btn-primary">
          ✓ Cadastrar Equipamento
        </button>
      </div>
    </form>
  </div>
</div>
