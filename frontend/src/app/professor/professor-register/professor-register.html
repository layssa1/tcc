<div class="register-page">
  <header class="view-header">
    <div class="view-header__left">
      <span class="view-header__badge">CADASTRO DE DOCENTE</span>
      <h1 class="view-header__title">Novo Professor</h1>
      <p class="view-header__subtitle">
        Cadastre um novo professor para liberar acesso a reservas de salas e equipamentos.
      </p>
    </div>

    <div class="view-header__actions">
      <a routerLink="/professor" class="btn btn-secondary">
        ← Voltar à Lista
      </a>
    </div>
  </header>

  <div class="ui-card register-card">
    <form (ngSubmit)="salvar()">
      <div class="form-group">
        <label class="form-label" for="regNome">Nome Completo do Docente *</label>
        <input
          id="regNome"
          type="text"
          class="form-control"
          placeholder="Ex.: Profª. Juliana Martins"
          [(ngModel)]="nome"
          name="nome"
          required
        >
      </div>

      <div class="form-row">
        <div class="form-group flex-1">
          <label class="form-label" for="regRg">RG</label>
          <input
            id="regRg"
            type="text"
            class="form-control"
            placeholder="00.000.000-0"
            [(ngModel)]="rg"
            name="rg"
          >
        </div>

        <div class="form-group flex-1">
          <label class="form-label" for="regTel">Telefone / WhatsApp</label>
          <input
            id="regTel"
            type="text"
            class="form-control"
            placeholder="(14) 99999-9999"
            [(ngModel)]="telefone"
            name="telefone"
          >
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="regEmail">E-mail Institucional</label>
        <input
          id="regEmail"
          type="email"
          class="form-control"
          placeholder="juliana.martins@escola.gov.br"
          [(ngModel)]="email"
          name="email"
        >
      </div>

      <div class="form-row">
        <div class="form-group flex-1">
          <label class="form-label" for="regDisc">Disciplina / Área de Atuação</label>
          <input
            id="regDisc"
            type="text"
            class="form-control"
            placeholder="Ex.: Química & Ciências da Natureza"
            [(ngModel)]="disciplina"
            name="disciplina"
          >
        </div>

        <div class="form-group flex-1">
          <label class="form-label" for="regStatus">Status</label>
          <select
            id="regStatus"
            class="form-select"
            [(ngModel)]="status"
            name="status"
          >
            <option value="Ativo">Ativo (Permite agendamentos)</option>
            <option value="Inativo">Inativo</option>
          </select>
        </div>
      </div>

      <div class="ui-card-footer">
        <a routerLink="/professor" class="btn btn-secondary">
          Cancelar
        </a>
        <button type="submit" class="btn btn-primary">
          ✓ Salvar Professor
        </button>
      </div>
    </form>
  </div>
</div>
