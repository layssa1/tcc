<div class="register-page">
  <header class="view-header">
    <div class="view-header__left">
      <span class="view-header__badge">FORMULÁRIO DE AGENDAMENTO</span>
      <h1 class="view-header__title">Nova Reserva de Espaço</h1>
      <p class="view-header__subtitle">
        Agende o uso de laboratórios de informática, sala maker ou auditório com validação de conflito de horários.
      </p>
    </div>

    <div class="view-header__actions">
      <a routerLink="/reserva" class="btn btn-secondary">
        ← Voltar às Reservas
      </a>
    </div>
  </header>

  <div class="ui-card register-card">
    <form (ngSubmit)="salvar()">
      <div class="form-group">
        <label class="form-label" for="regResProf">Professor Responsável *</label>
        <select
          id="regResProf"
          class="form-select"
          [(ngModel)]="professorId"
          name="professorId"
          required
        >
          <option *ngFor="let prof of dataService.professores()" [value]="prof.id">
            {{ prof.nome }} — {{ prof.disciplina }}
          </option>
        </select>
      </div>

      <div class="form-row">
        <div class="form-group flex-1">
          <label class="form-label" for="regResEsp">Espaço Solicitado *</label>
          <select
            id="regResEsp"
            class="form-select"
            [(ngModel)]="espacoId"
            name="espacoId"
            required
          >
            <option *ngFor="let espaco of dataService.espacos()" [value]="espaco.id">
              {{ espaco.nome }} ({{ espaco.capacidade }} vagas)
            </option>
          </select>
        </div>

        <div class="form-group flex-1">
          <label class="form-label" for="regResEq">Equipamento Adicional</label>
          <select
            id="regResEq"
            class="form-select"
            [(ngModel)]="equipamentoNome"
            name="equipamentoNome"
          >
            <option value="Nenhum">Nenhum equipamento adicional</option>
            <option *ngFor="let eq of dataService.equipamentos()" [value]="eq.nome">
              {{ eq.nome }} ({{ eq.quantidadeDisponivel }} disp.)
            </option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group flex-1">
          <label class="form-label" for="regResDia">Dia da Semana</label>
          <select
            id="regResDia"
            class="form-select"
            [(ngModel)]="diaSemana"
            name="diaSemana"
          >
            <option value="Segunda">Segunda-feira</option>
            <option value="Terça">Terça-feira</option>
            <option value="Quarta">Quarta-feira</option>
            <option value="Quinta">Quinta-feira</option>
            <option value="Sexta">Sexta-feira</option>
          </select>
        </div>

        <div class="form-group flex-1">
          <label class="form-label" for="regResTurma">Turma / Série *</label>
          <input
            id="regResTurma"
            type="text"
            class="form-control"
            placeholder="Ex.: 3º Ano A - Ensino Médio"
            [(ngModel)]="turma"
            name="turma"
            required
          >
        </div>
      </div>

      <div class="form-row">
        <div class="form-group flex-1">
          <label class="form-label" for="regResIni">Horário de Início *</label>
          <input
            id="regResIni"
            type="time"
            class="form-control"
            [(ngModel)]="horarioInicio"
            name="horarioInicio"
            required
          >
        </div>

        <div class="form-group flex-1">
          <label class="form-label" for="regResFim">Horário de Término *</label>
          <input
            id="regResFim"
            type="time"
            class="form-control"
            [(ngModel)]="horarioFim"
            name="horarioFim"
            required
          >
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="regResObs">Observações / Descrição da Atividade</label>
        <textarea
          id="regResObs"
          class="form-control form-textarea"
          placeholder="Ex.: Aula interdisciplinar com projeção de documentário histórico."
          [(ngModel)]="observacao"
          name="observacao"
        ></textarea>
      </div>

      <div class="ui-card-footer">
        <a routerLink="/reserva" class="btn btn-secondary">
          Cancelar
        </a>
        <button type="submit" class="btn btn-primary">
          ✓ Confirmar Agendamento
        </button>
      </div>
    </form>
  </div>
</div>
